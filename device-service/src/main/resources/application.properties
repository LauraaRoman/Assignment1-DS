server.port = ${SERVER_PORT:8081}

database.ip = ${DB_IP:localhost}
database.port = ${DB_PORT:3306}
database.user = ${DB_USER:root}
database.password = ${DB_PASSWORD:}
database.name = ${DB_DBNAME:device_db}

spring.datasource.url = jdbc:mysql://${database.ip}:${database.port}/${database.name}?createDatabaseIfNotExist=true
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true

spring.rabbitmq.host=${RABBITMQ_SYNC_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_SYNC_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.queue.sync=sync.queue.device-service
rabbitmq.exchange.sync=sync.exchange