server.port=8083

spring.datasource.url=jdbc:mysql://${DB_IP:localhost}:${DB_PORT:3306}/${DB_DBNAME:monitoring_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

rabbitmq.sync.host=${RABBITMQ_SYNC_HOST:localhost}
rabbitmq.sync.port=${RABBITMQ_SYNC_PORT:5672}
rabbitmq.sync.username=${RABBITMQ_USER:guest}
rabbitmq.sync.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.data.host=${RABBITMQ_DATA_HOST:localhost}
rabbitmq.data.port=${RABBITMQ_DATA_PORT:5673}
rabbitmq.data.username=${RABBITMQ_USER:guest}
rabbitmq.data.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.queue.data=device.data.queue
rabbitmq.queue.sync=sync.queue.monitoring-service
rabbitmq.exchange.data=device.data.exchange
rabbitmq.exchange.sync=sync.exchange
