server.port=8084

spring.rabbitmq.host=${RABBITMQ_DATA_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_DATA_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.queue.data=device.data.queue
rabbitmq.exchange.data=device.data.exchange

simulator.interval-ms=${SIMULATOR_INTERVAL_MS:600000}
device.service.url=${DEVICE_SERVICE_URL:http://localhost:8081}
simulator.device-ids=${SIMULATOR_DEVICE_IDS:}
