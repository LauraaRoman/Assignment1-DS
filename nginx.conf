server {
    listen 80;
    server_name localhost;

    # Internal token validation subrequest
    location = /validate_token {
        internal;
        proxy_pass http://auth-service:8082/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    # Public routes: login and register
    location /auth/login {
        proxy_pass http://auth-service:8082/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/register {
        proxy_pass http://auth-service:8082/auth/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Other auth routes (credential deletion called service-to-service on internal network, not exposed here)
    location /auth {
        proxy_pass http://auth-service:8082/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # User routes: all protected (GET/PUT/DELETE require token; POST /users also requires token)
    # Self-registration creates only auth credentials; admin creates full user profiles via dashboard
    location /users {
        auth_request /validate_token;
        proxy_pass http://user-service:8080/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Device routes: all protected
    location /devices {
        auth_request /validate_token;
        proxy_pass http://device-service:8081/devices;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
}
