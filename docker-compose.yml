services:
  # ================= Baze de Date =================
  user-db:
    image: mysql:8.0
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "3308:3306"
    networks:
      - utcn-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  device-db:
    image: mysql:8.0
    container_name: device-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: device_db
    ports:
      - "3307:3306"
    networks:
      - utcn-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3309:3306"
    networks:
      - utcn-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  monitoring-db:
    image: mysql:8.0
    container_name: monitoring-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: monitoring_db
    ports:
      - "3310:3306"
    networks:
      - utcn-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  # ================= Message Brokers =================
  rabbitmq-sync:
    image: rabbitmq:3-management
    container_name: rabbitmq-sync
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - utcn-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbitmq-data:
    image: rabbitmq:3-management
    container_name: rabbitmq-data
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - utcn-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ================= Microservicii =================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - DB_IP=auth-db
      - DB_PORT=3306
      - DB_DBNAME=auth_db
      - DB_USER=root
      - DB_PASSWORD=root
      - JWT_SECRET=3f8a2b1c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a
      - RABBITMQ_SYNC_HOST=rabbitmq-sync
      - RABBITMQ_SYNC_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq-sync:
        condition: service_healthy
    networks:
      - utcn-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_IP=user-db
      - DB_PORT=3306
      - DB_DBNAME=user_db
      - DB_USER=root
      - DB_PASSWORD=root
      - AUTH_SERVICE_URL=http://auth-service:8082
      - RABBITMQ_SYNC_HOST=rabbitmq-sync
      - RABBITMQ_SYNC_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq-sync:
        condition: service_healthy
    networks:
      - utcn-network

  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: device-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - DB_IP=device-db
      - DB_PORT=3306
      - DB_DBNAME=device_db
      - DB_USER=root
      - DB_PASSWORD=root
      - RABBITMQ_SYNC_HOST=rabbitmq-sync
      - RABBITMQ_SYNC_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      device-db:
        condition: service_healthy
      rabbitmq-sync:
        condition: service_healthy
    networks:
      - utcn-network

  monitoring-service:
    build:
      context: ./monitoring-service
      dockerfile: Dockerfile
    container_name: monitoring-service
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - DB_IP=monitoring-db
      - DB_PORT=3306
      - DB_DBNAME=monitoring_db
      - DB_USER=root
      - DB_PASSWORD=root
      - RABBITMQ_SYNC_HOST=rabbitmq-sync
      - RABBITMQ_SYNC_PORT=5672
      - RABBITMQ_DATA_HOST=rabbitmq-data
      - RABBITMQ_DATA_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      monitoring-db:
        condition: service_healthy
      rabbitmq-sync:
        condition: service_healthy
      rabbitmq-data:
        condition: service_healthy
    networks:
      - utcn-network

  # ================= Frontend =================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - utcn-network

  # ================= API Gateway =================
  reverse-proxy:
    image: nginx:latest
    container_name: reverse-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8888:80"
    depends_on:
      - frontend
      - user-service
      - device-service
      - auth-service
      - monitoring-service
    networks:
      - utcn-network

networks:
  utcn-network:
    driver: bridge
