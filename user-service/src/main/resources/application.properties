database.ip = ${DB_IP:localhost}
database.port = ${DB_PORT:3306}
database.user = ${DB_USER:root}
database.password = ${DB_PASSWORD:}
database.name = ${DB_DBNAME:user_db}

spring.datasource.url = jdbc:mysql://${database.ip}:${database.port}/${database.name}?createDatabaseIfNotExist=true
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true

device.service.url=${DEVICE_SERVICE_URL:http://device-service:8081}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service:8082}